# ╔════════════════════════════════════════════╗
# ║  CODE4U · el lockscreen es tu boleto   ║
# ╚════════════════════════════════════════════╝
$impact = Anton
$type   = Courier Prime
$fg     = rgb(f2ead8)
$dim    = rgb(aab4f2)
$bg     = rgb(0d0f24)
$accent = rgb(e33a8e)
$warn   = rgb(d8323c)

general {
    hide_cursor = true
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = board, 0.2, 0.8, 0.25, 1
    animation = fadeIn, 1, 5, board
    animation = fadeOut, 1, 5, board
    animation = inputFieldDots, 1, 2, board
}

background {
    monitor =
    # frame del fondo animado (neón incluido)
    path = ~/.config/hypr/wall/code4u-lock.png
    color = rgba(0d0f24ff)
    brightness = 0.55
}

# ---------- tablero de salidas: reloj gigante ----------
label {
    monitor =
    text = $TIME
    font_family = $impact
    font_size = 150
    color = $fg
    position = 0, 210
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] LC_TIME=es_MX.UTF-8 date +"%A · %-d %B" | tr '[:lower:]' '[:upper:]' | sed 's/./& /g'
    font_family = $type
    font_size = 12
    color = $dim
    position = 0, 85
    halign = center
    valign = center
}

# ---------- el boleto ----------
# cuerpo crema
shape {
    monitor =
    size = 620, 190
    color = rgb(f2ead8)
    rounding = 6
    position = 0, -60
    halign = center
    valign = center
}
# talón
shape {
    monitor =
    size = 150, 190
    color = rgb(e9dfc8)
    rounding = 6
    position = 235, -60
    halign = center
    valign = center
}
# esquinas rectas sólo del lado que se une al cuerpo (las de afuera quedan redondas)
shape {
    monitor =
    size = 20, 190
    color = rgb(e9dfc8)
    rounding = 0
    position = 170, -60
    halign = center
    valign = center
}

label {
    monitor =
    text = B O A R D I N G   P A S S  ·  C O D E 4 U
    font_family = $type
    font_size = 8
    color = rgba(1b1f4aaa)
    position = -75, 14
    halign = center
    valign = center
    zindex = 2
}
label {
    monitor =
    text = cmd[update:0] echo "$USER" | tr '[:lower:]' '[:upper:]'
    font_family = $impact
    font_size = 30
    color = $bg
    position = -75, -30
    halign = center
    valign = center
    zindex = 2
}
label {
    monitor =
    text = <span size="6pt" foreground="##1b1f4a" alpha="67%">FROM</span> <b>TTY1</b>   <span size="6pt" foreground="##1b1f4a" alpha="67%">TO</span> <b>HYPRLAND</b>   <span size="6pt" foreground="##1b1f4a" alpha="67%">GATE</span> <b>04</b>   <span size="6pt" foreground="##1b1f4a" alpha="67%">SEAT</span> <b>13A</b>
    font_family = $type
    font_size = 10
    color = $bg
    position = -75, -72
    halign = center
    valign = center
    zindex = 2
}

input-field {
    monitor =
    size = 400, 40
    outline_thickness = 2
    outer_color = $bg
    inner_color = rgba(f2ead800)
    font_color = $bg
    check_color = $accent
    fail_color = $warn
    capslock_color = rgb(f2c76b)
    rounding = 2
    dots_size = 0.28
    dots_spacing = 0.5
    dots_center = false
    fade_on_empty = false
    placeholder_text = <span foreground="##1b1f4a" alpha="60%">C O N T R A S E Ñ A</span>
    fail_text = <span foreground="##d8323c"><b>BOLETO INVÁLIDO</b> · $ATTEMPTS</span>
    font_family = $type
    position = -75, -115
    halign = center
    valign = center
    zindex = 2
}

# talón: sello + folio
label {
    monitor =
    text = <span foreground="##d8323c"><b> LOCKED </b></span>
    font_family = $impact
    font_size = 16
    color = $warn
    rotate = 8
    position = 235, -15
    halign = center
    valign = center
    zindex = 2
}
label {
    monitor =
    text = ▌▍▌▌▏▌▍▏▌▌▍▌
    font_family = JetBrainsMono Nerd Font
    font_size = 13
    color = $bg
    position = 235, -70
    halign = center
    valign = center
    zindex = 2
}
label {
    monitor =
    text = cmd[update:60000] echo "N O.  $(date +%H%M%S | cut -c1-6)"
    font_family = $type
    font_size = 8
    color = rgba(1b1f4aaa)
    position = 235, -125
    halign = center
    valign = center
    zindex = 2
}
