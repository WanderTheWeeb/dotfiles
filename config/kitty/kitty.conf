# CODE4U · kitty
font_family      MartianMono Nerd Font
bold_font        MartianMono Nerd Font Bold
italic_font      auto
font_size        10.5
modify_font cell_height 112%
disable_ligatures never

# ventana: capa negra translúcida sobre el mapa
background_opacity 0.42
dynamic_background_opacity yes
window_padding_width 14 18
confirm_os_window_close 0
enable_audio_bell no
cursor_shape block
cursor_blink_interval 0.53
cursor_trail 3

# pestañas tipo letrero
tab_bar_edge bottom
tab_bar_style separator
tab_separator "  ·  "
tab_title_template "{index} {title}"
active_tab_font_style bold

# ---- paleta ----
foreground            #f2ead8
background            #0d0f24
selection_foreground  #f2ead8
selection_background  #5a1f45
cursor                #e33a8e
cursor_text_color     #0d0f24
url_color             #ff7cbd
active_border_color   #e33a8e
inactive_border_color #2a2f5e
active_tab_foreground   #f2ead8
active_tab_background   #1b1f4a
inactive_tab_foreground #aab4f2
inactive_tab_background #0d0f24
tab_bar_background      #0d0f24

color0  #12153a
color8  #2a2f5e
color1  #d8323c
color9  #ff5a62
color2  #7fd6a8
color10 #a6ecc6
color3  #f2c76b
color11 #ffdd93
color4  #6b79d6
color12 #aab4f2
color5  #e33a8e
color13 #ff7cbd
color6  #6bc9d6
color14 #9fe4ee
color7  #f2ead8
color15 #fffaf0

# ---- shell / integración ----
shell zsh
shell_integration enabled
copy_on_select clipboard
map ctrl+shift+enter new_window_with_cwd
map ctrl+shift+t     new_tab_with_cwd
map ctrl+shift+f     launch --type=overlay --stdin-source=@screen_scrollback fzf --no-sort --tac

# ---- transparencia en vivo: Ctrl+Shift+A y luego ↑ / ↓ / 0 (default) ----
map ctrl+shift+a>up   set_background_opacity +0.05
map ctrl+shift+a>down set_background_opacity -0.05
map ctrl+shift+a>0    set_background_opacity default
