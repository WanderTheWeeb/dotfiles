# CODE4U · yazi — ruta nocturna (esquema de yazi ≥ 25.5: [mgr], [indicator])
# fondo transparente: sólo se pinta lo seleccionado

[mgr]
cwd = { fg = "#e33a8e", bold = true }
find_keyword  = { fg = "#f2c76b", bold = true, underline = true }
find_position = { fg = "#ff7cbd", italic = true }
marker_copied   = { fg = "#7fd6a8", bg = "#7fd6a8" }
marker_cut      = { fg = "#d8323c", bg = "#d8323c" }
marker_marked   = { fg = "#6bc9d6", bg = "#6bc9d6" }
marker_selected = { fg = "#e33a8e", bg = "#e33a8e" }
count_copied   = { fg = "#0d0f24", bg = "#7fd6a8" }
count_cut      = { fg = "#f2ead8", bg = "#d8323c" }
count_selected = { fg = "#f2ead8", bg = "#e33a8e" }
border_symbol = "│"
border_style  = { fg = "#2a2f5e" }

[indicator]
parent  = { fg = "#f2ead8", bg = "#1b1f4a" }
current = { fg = "#f2ead8", bg = "#5a1f45", bold = true }
preview = { fg = "#f2ead8", bg = "#1b1f4a" }

[tabs]
active   = { fg = "#0d0f24", bg = "#e33a8e", bold = true }
inactive = { fg = "#aab4f2", bg = "#1b1f4a" }

[mode]
normal_main = { fg = "#0d0f24", bg = "#e33a8e", bold = true }
normal_alt  = { fg = "#e33a8e", bg = "#1b1f4a" }
select_main = { fg = "#0d0f24", bg = "#6bc9d6", bold = true }
select_alt  = { fg = "#6bc9d6", bg = "#1b1f4a" }
unset_main  = { fg = "#0d0f24", bg = "#f2c76b", bold = true }
unset_alt   = { fg = "#f2c76b", bg = "#1b1f4a" }

[status]
perm_sep   = { fg = "#2a2f5e" }
perm_type  = { fg = "#6b79d6" }
perm_read  = { fg = "#f2c76b" }
perm_write = { fg = "#d8323c" }
perm_exec  = { fg = "#7fd6a8" }
progress_label  = { fg = "#f2ead8", bold = true }
progress_normal = { fg = "#e33a8e", bg = "#1b1f4a" }
progress_error  = { fg = "#d8323c", bg = "#1b1f4a" }

[input]
border   = { fg = "#e33a8e" }
title    = { fg = "#ff7cbd", bold = true }
value    = { fg = "#f2ead8" }
selected = { bg = "#5a1f45" }

[pick]
border   = { fg = "#e33a8e" }
active   = { fg = "#ff7cbd", bold = true }
inactive = { fg = "#aab4f2" }

[confirm]
border  = { fg = "#e33a8e" }
title   = { fg = "#ff7cbd", bold = true }
content = { fg = "#f2ead8" }
list    = { fg = "#aab4f2" }
btn_yes = { fg = "#0d0f24", bg = "#e33a8e", bold = true }
btn_no  = { fg = "#aab4f2" }

[cmp]
border   = { fg = "#6b79d6" }
active   = { fg = "#f2ead8", bg = "#5a1f45" }
inactive = { fg = "#aab4f2" }

[tasks]
border  = { fg = "#6b79d6" }
title   = { fg = "#e33a8e", bold = true }
hovered = { fg = "#f2ead8", bg = "#5a1f45" }

[which]
mask            = { bg = "#0d0f24" }
cand            = { fg = "#6bc9d6" }
rest            = { fg = "#2a2f5e" }
desc            = { fg = "#aab4f2" }
separator       = "  ▸ "
separator_style = { fg = "#e33a8e" }

[help]
on      = { fg = "#e33a8e" }
run     = { fg = "#6bc9d6" }
desc    = { fg = "#aab4f2" }
hovered = { bg = "#5a1f45", bold = true }
footer  = { fg = "#f2ead8", bg = "#1b1f4a" }

[notify]
title_info  = { fg = "#7fd6a8" }
title_warn  = { fg = "#f2c76b" }
title_error = { fg = "#d8323c" }

[filetype]
rules = [
  { mime = "image/*", fg = "#6bc9d6" },
  { mime = "{audio,video}/*", fg = "#f2c76b" },
  { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#ff7cbd" },
  { mime = "application/{pdf,doc,rtf}", fg = "#7fd6a8" },
  { url = "*", is = "orphan", fg = "#d8323c" },
  { url = "*", is = "exec", fg = "#7fd6a8" },
  { url = "*/", fg = "#6b79d6", bold = true },
  { url = "*", fg = "#f2ead8" },
]
